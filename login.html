<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Web Phim</title>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-wrapper">
        
        <div class="form-container" id="loginForm">
            <h2 class="form-title">Đăng Nhập</h2>
            
            <div class="form-group">
                <label>Email</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="text" class="login-name" placeholder="Nhập email của bạn">
                </div>
            </div>
            
            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="login-password" placeholder="Nhập mật khẩu">
                    <i class="fas fa-eye show-pass" onclick="showPass(this)"></i>
                </div>
            </div>

            <button class="submit-btn" onclick="dang__nhap()">ĐĂNG NHẬP</button>
            
            <div class="form-footer">
                <p>Bạn chưa có tài khoản? <a href="#" onclick="toggleForm()">Đăng ký ngay</a></p>
                <a href="fpt.html" class="back-home"><i class="fas fa-arrow-left"></i> Về trang chủ</a>
            </div>
        </div>

        <div class="form-container hidden" id="registerForm">
            <h2 class="form-title">Đăng Ký</h2>
            
            <div class="form-group">
                <label>Họ và Tên</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" class="sign__up-name" placeholder="Nhập họ tên">
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="text" class="sign__up-email" placeholder="Nhập email">
                </div>
            </div>
            
            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="sign__up-password" placeholder="Tạo mật khẩu">
                    <i class="fas fa-eye show-pass" onclick="showPass(this)"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Nhập lại mật khẩu</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="sign__up-repassword" placeholder="Xác nhận mật khẩu">
                </div>
            </div>

            <button class="submit-btn" onclick="dang__ky()">ĐĂNG KÝ</button>
            
            <div class="form-footer">
                <p>Đã có tài khoản? <a href="#" onclick="toggleForm()">Đăng nhập</a></p>
                <a href="fpt.html" class="back-home"><i class="fas fa-arrow-left"></i> Về trang chủ</a>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
    <script src="review.js"></script>

    <script>
        // Hàm chuyển đổi giữa 2 form
        function toggleForm() {
            const login = document.getElementById('loginForm');
            const register = document.getElementById('registerForm');
            
            // Thêm hiệu ứng mờ dần cho mượt
            if (login.classList.contains('hidden')) {
                login.classList.remove('hidden');
                register.classList.add('hidden');
            } else {
                login.classList.add('hidden');
                register.classList.remove('hidden');
            }
        }

        // Hàm ẩn hiện mật khẩu
        function showPass(icon) {
            const input = icon.previousElementSibling;
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.add('fa-eye');
                icon.classList.remove('fa-eye-slash');
            }
        }
    </script>
</body>
</html>
